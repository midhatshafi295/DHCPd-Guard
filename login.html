<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHCPd-Guard | Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#f1f5f9;display:flex;align-items:center;justify-content:center;color:#172033}.card{width:390px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:34px;box-shadow:0 18px 50px rgba(15,23,42,.12)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{width:48px;height:48px;border-radius:12px;background:#2563eb;color:#fff;display:grid;place-items:center;font-size:23px}.brand h1{margin:0;font-size:23px}.brand p{margin:4px 0 0;color:#64748b;font-size:13px}.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:9px;font-size:14px;outline:none}.field input:focus{border-color:#2563eb}.btn{width:100%;padding:12px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:700;font-size:14px;cursor:pointer}.btn:disabled{opacity:.6}.error{min-height:20px;margin:4px 0 12px;color:#dc2626;font-size:13px}.hint{margin-top:18px;text-align:center;font-size:12px;color:#64748b}</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo">🛡</div><div><h1>DHCPd-Guard</h1><p>Secure DHCP Management</p></div></div>
  <form id="loginForm">
    <div class="field"><label>Username</label><input id="username" autocomplete="username" required></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <div class="error" id="error"></div>
    <button class="btn" id="loginBtn">Login</button>
  </form>
  <div class="hint">Local project account: admin / admin123</div>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const btn=document.getElementById("loginBtn"), error=document.getElementById("error");
 btn.disabled=true; error.textContent="";
 try{
  const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});
  const data=await r.json();
  if(!r.ok) throw new Error(data.error||"Login failed");
  location.href="/index.html";
 }catch(err){error.textContent=err.message;}finally{btn.disabled=false;}
});
</script>
</body>
</html>
